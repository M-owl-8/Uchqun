name: Deploy to Railway

# CONSOLIDATION II P8 / D-50 — this workflow used to trigger on `push` to main,
# with NO relationship to CI whatsoever. CI and the deploy raced each other on
# every commit, and because CI was red on every commit for the entire campaign,
# every one of those commits deployed to production anyway. A gate that cannot
# block anything is not a gate.
#
# GitHub Actions cannot express `needs:` across workflows, so the dependency is
# expressed with `workflow_run`: this workflow now starts only after CI has
# COMPLETED, and every job is guarded on CI having concluded 'success'.
#
# Two details that make the difference between a real gate and a decorative one:
#   - `types: [completed]` fires on failure too, so the conclusion MUST be
#     checked in an `if:` or the gate is theatre
#   - `workflow_run` checks out the DEFAULT BRANCH by default, not the commit
#     that was tested. Every checkout below pins
#     `ref: ${{ github.event.workflow_run.head_sha }}` so the artefact deployed
#     is the artefact CI actually verified.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Backend URL is public — baked into frontend bundles at build time
env:
  VITE_API_URL: https://uchqun-production-b484.up.railway.app/api

jobs:
  # Backend: railway up runs from REPO ROOT so Railway's configured
  # Root Directory ("backend") points correctly into the uploaded content.
  deploy-backend:
    runs-on: ubuntu-latest
    # the gate itself
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy Backend (Uchqun) to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping deployment."
            exit 0
          fi
          curl -fsSL https://github.com/railwayapp/cli/releases/download/v5.4.0/railway-v5.4.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          sudo mv /tmp/railway /usr/local/bin/railway
          echo "--- railway whoami ---"
          railway whoami || true
          echo "--- railway up ---"
          railway up --service Uchqun --detach
          echo "Backend deployment triggered."

  # Frontends: build in CI (../shared is accessible in full checkout),
  # then deploy from REPO ROOT so dist/ is in the upload context.
  # Root .railwayignore excludes node_modules but NOT dist/,
  # so pre-built dist/ is included in the Railway upload.
  deploy-frontends:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - app: admin
            service: admin
            label: Admin
          - app: teacher
            service: teacher
            label: Teacher
          - app: reception
            service: reception
            label: Reception
          - app: government
            service: government
            label: Government
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build ${{ matrix.label }}
        run: |
          cd ${{ matrix.app }}
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Deploy ${{ matrix.label }} to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping deployment."
            exit 0
          fi
          curl -fsSL https://github.com/railwayapp/cli/releases/download/v5.4.0/railway-v5.4.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          sudo mv /tmp/railway /usr/local/bin/railway
          echo "--- railway whoami ---"
          railway whoami || true
          echo "--- railway up ---"
          railway up --service ${{ matrix.service }} --detach
          echo "${{ matrix.label }} deployment triggered."

  # Without this, a blocked deploy is INVISIBLE: the jobs above simply skip and
  # the run page shows nothing that says "production was protected". This job
  # fails loudly, so the block is a legible event rather than an absence.
  blocked:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    steps:
      - name: Deployment blocked — CI did not pass
        run: |
          echo "CI concluded: ${{ github.event.workflow_run.conclusion }}"
          echo "commit:       ${{ github.event.workflow_run.head_sha }}"
          echo "CI run:       ${{ github.event.workflow_run.html_url }}"
          echo ""
          echo "No deployment was triggered. Fix CI and push again."
          exit 1
