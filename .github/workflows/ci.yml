name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run ESLint
        run: |
          if [ -f "backend/.eslintrc.cjs" ] || [ -f "backend/.eslintrc.js" ] || [ -f "backend/.eslintrc.json" ]; then
            cd backend && npm ci && npx eslint . --ext .js --max-warnings 0
          else
            echo "No ESLint config found, skipping"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Audit backend production dependencies
        run: cd backend && npm audit --audit-level=high --omit=dev
      - name: Audit frontend dependencies
        run: |
          for app in admin teacher reception government; do
            echo "Auditing $app..."
            cd $GITHUB_WORKSPACE/$app && npm audit --audit-level=high
          done

  sast:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Trivy — block on CRITICAL/HIGH (table mode)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
      - name: Trivy — generate SARIF for Security tab
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # D-67: this was postgres:15 while production runs 18.4. Three major
        # versions of divergence, in the lane whose entire purpose is to prove
        # the migrations and queries behave as they will in production. It is
        # not academic: PG17+ records NOT NULL constraints in pg_constraint,
        # so the schema diff reported 400+ phantom differences that were purely
        # the version gap.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchqun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: uchqun_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd backend && npm ci
      - name: Run backend tests with coverage
        run: |
          cd backend
          set +e
          npm test -- --coverage 2>&1 | tee /tmp/jest-backend.log
          STATUS=${PIPESTATUS[0]}
          set -e
          [ "$STATUS" -ne 0 ] && exit "$STATUS"
          TESTS=$(grep -oE '^Tests: +[0-9]+ passed, ([0-9]+) total' /tmp/jest-backend.log | grep -oE '[0-9]+' | tail -1)
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-suite-baseline.mjs backend --tests "${TESTS:-0}"

  # DEEP HARDENING P8 / D-49 — backend/scripts/verify-i18n.js validates the
  # backend ERROR CATALOGUE only. It passed 252/252 while the UI shipped 8 raw
  # i18n keys that reached users as dotted identifiers. This gate reads the
  # frontend catalogues and every t() call site, and fails the build on any
  # raw key. English defaultValue fallbacks are reported, not failed.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend error-catalogue parity
        run: node backend/scripts/verify-i18n.js
      - name: Frontend i18n gate (fails on raw keys)
        run: node scripts/verify-frontend-i18n.mjs

  # CONSOLIDATION II P8 — CLAUDE.md rules that were prose only.
  # P1 found that the enforced rules are largely the mechanical ones, while the
  # ones encoding tenant-safety judgement (R15) were enforced by nothing. This
  # gate found four live cross-tenant holes on its first run (D-61…D-64).
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CLAUDE.md convention gate (R15, R06, R09, R18, D-59)
        run: node scripts/verify-conventions.mjs

  # CONSOLIDATION II P8 — every migration must apply to an EMPTY database.
  # The production database has had every migration applied incrementally over
  # months; nothing proved the set still composes from nothing, which is what a
  # new environment, a restore drill or a second region would need.
  migrate-fresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        # D-67: this was postgres:15 while production runs 18.4. Three major
        # versions of divergence, in the lane whose entire purpose is to prove
        # the migrations and queries behave as they will in production. It is
        # not academic: PG17+ records NOT NULL constraints in pg_constraint,
        # so the schema diff reported 400+ phantom differences that were purely
        # the version gap.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchqun_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: uchqun_fresh
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd backend && npm ci
      - name: Apply every migration to an empty database
        run: cd backend && npm run migrate
      - name: Re-apply — migrations must be idempotent
        run: cd backend && npm run migrate

      # CAMPAIGN III P2 — "the migrations ran" is not "the migrations produce
      # production". D-65's seven tables and eleven columns existed only because
      # sync() once made them; a rebuild that completes but omits
      # children.schoolId would pass the step above and fail this one.
      - name: Dump the rebuilt schema
        run: node backend/scripts/schema-dump.mjs --out /tmp/fresh-schema.txt
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uchqun_fresh
      - name: Diff against the production snapshot
        run: node backend/scripts/schema-diff.mjs backend/schema/production-schema.txt /tmp/fresh-schema.txt
      - name: Upload the rebuilt schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-schema
          path: /tmp/fresh-schema.txt

  # CAMPAIGN III P3 — the real-Postgres integration lane.
  #
  # All 1632 tests in test-backend mock the database. Every dominant defect of
  # all three campaigns — D-47, D-53, D-54, D-61..D-64, D-65 — lives at the query
  # or schema layer, where a mocked suite is structurally blind. This lane runs
  # the real Express app, the real middleware chain and real Sequelize against a
  # real PostgreSQL whose schema is built BY MIGRATIONS, never by sync().
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uchqun_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: uchqun_integration
      DB_USER: postgres
      DB_PASSWORD: postgres
      # JWT_SECRET / JWT_REFRESH_SECRET / DATABASE_URL are deliberately NOT set
      # here. __tests__/integration/helpers/env.js supplies test defaults, and
      # gitleaks' generic-api-key rule fires on a high-entropy literal assigned
      # to JWT_SECRET in a workflow file — correctly, since it cannot tell a
      # throwaway CI value from a real one. Keeping them out of the yaml keeps
      # the scanner honest instead of teaching it to ignore that shape.
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          # The regression canary reverts files to pre-fix commits (6727bc27^,
          # cc9467e2^). The default shallow clone has neither, and git says so:
          #   fatal: invalid reference: 6727bc27^
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd backend && npm ci
      - name: Build the schema FROM MIGRATIONS
        run: cd backend && npm run migrate
      - name: Cross-tenant isolation matrix against a real database
        run: |
          cd backend
          set +e
          npm run test:integration 2>&1 | tee /tmp/jest-integration.log
          STATUS=${PIPESTATUS[0]}
          set -e
          [ "$STATUS" -ne 0 ] && exit "$STATUS"
          TESTS=$(grep -oE '^Tests: +[0-9]+ passed, ([0-9]+) total' /tmp/jest-integration.log | grep -oE '[0-9]+' | tail -1)
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-suite-baseline.mjs backend-integration --tests "${TESTS:-0}"

      # P3.4 / L14 — a lane that has never been observed FAILING is unverified,
      # however green it is. This reverts each known cross-tenant fix in the
      # runner's checkout only, requires the lane to go red naming the right
      # probe, restores, and requires green.
      #
      # It is a job rather than a one-off because of D-68: Railway deploys every
      # push to main independently of any gate, so committing a revert of a
      # cross-tenant fix would put a live hole into production. Here the revert
      # never leaves the runner.
      - name: Regression canary — the lane must still catch D-47, D-61, D-62, D-64
        run: cd backend && node scripts/regression-canary.mjs

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, teacher, reception, government]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd ${{ matrix.app }} && npm ci
      - name: Run frontend tests
        run: |
          cd ${{ matrix.app }}
          # `set +e` and the tee are load-bearing. This step runs under
          # `bash -e`, so `RESULT=$(npm test …)` ABORTS THE STEP the moment the
          # suite fails — before the echo — and the run page shows the script
          # source and no test output at all. A gate that hides why it failed is
          # the thing this campaign exists to remove, and I shipped one.
          #
          # --testTimeout=30000: the default 5s is too tight for a cold CI
          # runner transforming 34 files. P7 established these timeouts are
          # environmental (isolating a change with and without it gave identical
          # results); the suite passing here was previously luck.
          set +e
          npm test -- --run --reporter=verbose --testTimeout=30000 2>&1 | tee /tmp/vitest-${{ matrix.app }}.log
          STATUS=${PIPESTATUS[0]}
          set -e
          RESULT=$(cat /tmp/vitest-${{ matrix.app }}.log)
          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: ${{ matrix.app }} test suite exited $STATUS — see the output above."
            exit "$STATUS"
          fi
          if echo "$RESULT" | grep -q "No test files found"; then
            echo "ERROR: No test files found in ${{ matrix.app }}. Tests are required."
            exit 1
          fi

          # D-59: "some tests ran" is not "the tests ran". The teacher suite
          # reported `Test Files 11 passed (11)` against 19 files on disk and
          # exited 0 — vitest 4 had silently dropped 8 whose workers failed to
          # start. This check is the one that would have caught it: every test
          # file on disk must appear in the run.
          ON_DISK=$(find src -name '*.test.js' -o -name '*.test.jsx'                     -o -name '*.spec.js' -o -name '*.spec.jsx' | wc -l | tr -d ' ')
          COLLECTED=$(echo "$RESULT" | grep -oE 'Test Files[^(]*\(([0-9]+)\)' | grep -oE '[0-9]+' | tail -1)
          echo "test files on disk: $ON_DISK | collected by vitest: ${COLLECTED:-unknown}"
          if [ -z "$COLLECTED" ]; then
            echo "ERROR: could not read the collected test-file count from the vitest output."
            exit 1
          fi
          if [ "$COLLECTED" -lt "$ON_DISK" ]; then
            echo "ERROR: ${{ matrix.app }} collected $COLLECTED of $ON_DISK test files."
            echo "A suite that silently skips files and still exits 0 is worse than a failing test."
            exit 1
          fi

          # P4.3 — the collection check above compares collected against ON DISK,
          # so a DELETED file makes both fall together and it stays green. This
          # compares against a committed baseline and names what disappeared.
          # Tolerant of ANSI colour codes, exactly like the Test Files pattern
          # above. A strict 'Tests +N passed \(N\)' matches nothing against
          # vitest's coloured output and yields 0, which fails the gate for the
          # wrong reason.
          TESTS=$(echo "$RESULT" | grep -oE 'Tests[^(]*\(([0-9]+)\)' | grep -oE '[0-9]+' | tail -1)
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-suite-baseline.mjs ${{ matrix.app }} --tests "${TESTS:-0}"

  lint-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, teacher, reception, government]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd ${{ matrix.app }} && npm ci
      - name: Run ESLint
        run: cd ${{ matrix.app }} && npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [lint, lint-frontend, security, sast, test-backend, test-frontend, i18n, conventions, migrate-fresh, integration]
    env:
      VITE_API_URL: https://uchqun-production-b484.up.railway.app/api
    strategy:
      matrix:
        app: [admin, teacher, reception, government]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: cd ${{ matrix.app }} && npm ci
      - run: cd ${{ matrix.app }} && npm run build
