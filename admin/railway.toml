[build]
builder = "NIXPACKS"

[deploy]
# dist/ is pre-built in CI (../shared accessible there); npx serve needs no local deps
startCommand = "npx serve dist -s -l $PORT"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["echo 'dist pre-built in CI — skipping npm ci'"]

[phases.build]
cmds = ["echo 'noop'"]
