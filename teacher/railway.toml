[build]
builder = "NIXPACKS"

[deploy]
# MOBILE-AUTH-FIX: proxy-server.mjs serves dist AND reverse-proxies
# /api, /uploads, /socket.io to the backend so auth cookies are first-party
# (third-party cookies are blocked in Samsung Internet / iOS PWAs / TWA apps).
startCommand = "node proxy-server.mjs"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["echo 'dist pre-built in CI — skipping npm ci'"]

[phases.build]
cmds = ["echo 'noop'"]
