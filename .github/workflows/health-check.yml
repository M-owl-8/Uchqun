# Scheduled production health check — curls /health and /health/readiness and
# opens a GitHub issue when either fails.
#
# ── DISABLED BY DEFAULT ──────────────────────────────────────────────────────
# Two switches must be flipped to enable:
#   1. Set the repository VARIABLE  HEALTH_CHECK_ENABLED = true  (Settings → Variables)
#   2. Uncomment the `schedule:` block below (manual runs work via
#      workflow_dispatch once the variable is set).
#
# No secrets required — the health endpoints are public by design.
# Note: GitHub cron is best-effort (runs can be delayed/skipped under load);
# an external pinger (UptimeRobot) is the primary alert path, this is backup.
# ─────────────────────────────────────────────────────────────────────────────

name: Health Check

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *'   # every 15 minutes

permissions:
  issues: write

env:
  BACKEND_URL: https://uchqun-production-b484.up.railway.app

jobs:
  health:
    runs-on: ubuntu-latest
    if: vars.HEALTH_CHECK_ENABLED == 'true'
    steps:
      - name: Check /health and /health/readiness
        id: check
        run: |
          set +e
          FAILED=""
          for path in /health /health/readiness; do
            CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 15 "${BACKEND_URL}${path}")
            echo "${path} -> HTTP ${CODE}"
            cat /tmp/body
            if [ "$CODE" != "200" ]; then
              FAILED="${FAILED}${path} returned HTTP ${CODE}; "
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const failed = `${{ steps.check.outputs.failed }}` || 'health check failed (see run log)';
            const title = `🔴 Production health check failed`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-alert',
            });
            const body = `${failed}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['health-alert'],
              });
            }
